<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mask Cast</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<style>
  :root { --bg:#111; --fg:#eee; --muted:#999; --accent:#ff7a18; --card:#1d1d1d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px system-ui, sans-serif; max-width:480px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:12px; }
  label { display:block; margin:8px 0 4px; color:var(--muted); font-size:14px; }
  button { background:var(--accent); color:#000; border:0; border-radius:10px; padding:12px 16px; font-size:16px; font-weight:600; width:100%; margin-top:8px; }
  button.secondary { background:#333; color:var(--fg); }
  button:disabled { opacity:.5; }
  input[type=range] { width:100%; }
  .row { display:flex; gap:12px; align-items:center; }
  .row label { margin:0; color:var(--fg); }
  canvas { display:block; width:100%; max-width:230px; margin:8px auto; image-rendering:pixelated; background:#000; border-radius:8px; }
  progress { width:100%; }
  #log { font:12px ui-monospace, monospace; color:var(--muted); white-space:pre-wrap; max-height:140px; overflow:auto; }
</style>
</head>
<body>
<h1>Mask Cast</h1>

<div class="card">
  <input id="file" type="file" accept="image/gif,image/*,video/*" hidden>
  <button id="pick" class="secondary">Choose GIF / video</button>
  <canvas id="preview" width="368" height="464"></canvas>
  <div id="name" style="text-align:center;color:var(--muted);font-size:14px">Nothing loaded</div>
</div>

<div class="card">
  <div class="row">
    <label><input type="radio" name="mode" value="full" checked> Full mask</label>
    <label><input type="radio" name="mode" value="below"> Below the eyes</label>
  </div>
  <label>Frames: <span id="nVal">10</span></label>
  <input id="frames" type="range" min="1" max="10" value="10">
  <label>Brightness: <span id="bVal">80</span></label>
  <input id="bright" type="range" min="10" max="128" value="80">
  <label class="row"><input id="stay" type="checkbox"> Stay connected after sending</label>
</div>

<button id="send" disabled>Send to mask</button>
<button id="test" class="secondary">Send calibration pattern</button>
<progress id="prog" value="0" max="1" hidden></progress>

<div class="card" style="margin-top:12px"><div id="log"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
